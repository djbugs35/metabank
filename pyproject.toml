[project]
name = "metabank"
version = "0.1.0"
description = "Vision globale et analyse de mon patrimoine financier, en local, avec l'aide de l'IA"
requires-python = ">=3.12"
# woob : connexion aux espaces clients des banques françaises (BNP : comptes, assurance vie, PER).
dependencies = ["woob>=3.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
