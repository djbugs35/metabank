name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Environnement Python (versions du uv.lock)
        run: uv sync --locked
      - name: Lint et format
        run: |
          uv run ruff check metabank tests
          uv run ruff format --check metabank tests
      - name: Typage
        run: uv run mypy
      - name: Tests et couverture (80 % minimum)
        run: uv run pytest -q --cov
      - name: Syntaxe des scripts de la page
        run: for f in metabank/web/statique/*.js; do node --check "$f"; done
