name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Dépendances
        run: uv sync
      - name: Lint
        run: uv run ruff check metabank tests && uv run ruff format --check metabank tests
      - name: Tests (sans réseau, comptes fictifs)
        run: uv run pytest -q
